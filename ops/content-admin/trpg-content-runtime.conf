location ^~ /blog/ {
    # Keep legacy article URLs out of the static content alias.
    rewrite ^/blog/(?!index\.json/?$|posts/?$|images/?$)([a-zA-Z0-9][a-zA-Z0-9._-]*)/?$ /trpg/blog/$1 permanent;
    alias /var/www/trpg-content/blog/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /wiki/ {
    alias /var/www/trpg-content/wiki/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /content-assets/ {
    alias /home/ubuntu/public_files/gate/trpg-content/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}
