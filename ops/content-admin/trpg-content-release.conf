location ^~ /blog/ {
    # Keep legacy article URLs out of the static content alias.
    rewrite ^/blog/(?!index\.json/?$|posts/?$|images/?$)([a-zA-Z0-9][a-zA-Z0-9._-]*)/?$ /trpg/blog/$1 permanent;
    alias /var/www/trpg-helper/current/blog/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /wiki/ {
    alias /var/www/trpg-helper/current/wiki/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /content-assets/ {
    return 404;
}
