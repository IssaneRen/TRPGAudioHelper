location ^~ /blog/ {
    alias /var/www/trpg-helper/current/blog/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /wiki/ {
    alias /var/www/trpg-helper/current/wiki/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /content-assets/ {
    return 404;
}
