name: Server Health Check

# 手动触发的只读体检：通过仓库 Secrets SSH 到生产服务器，
# 采集负载/内存/磁盘/服务状态并输出到 Actions 日志。
# 不修改服务器任何内容；需要更新时另走部署流程。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server health metrics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            echo "===== 时间 / 开机 / 负载 ====="
            date
            who -b || true
            uptime
            echo "CPU 核心数: $(nproc)"
            echo
            echo "===== 内存 / Swap ====="
            free -m
            echo
            echo "===== 磁盘 ====="
            df -h
            echo
            echo "===== inode（根分区）====="
            df -i / | head -3
            echo
            echo "===== CPU 占用前几名（仅进程名，不含参数）====="
            ps -eo user,pid,pcpu,pmem,etime,comm --sort=-pcpu | head -8
            echo
            echo "===== 内存占用前几名 ====="
            ps -eo user,pid,pcpu,pmem,etime,comm --sort=-pmem | head -8
            echo
            echo "===== 系统与服务 ====="
            systemctl is-system-running || true
            echo "nginx: $(systemctl is-active nginx || true)"
            echo
            echo "===== 开机自启检查 ====="
            for svc in nginx docker lucius-note public-files trpg-ai-gateway weekly-report; do
              echo "$svc: enabled=$(systemctl is-enabled $svc 2>&1 || true) active=$(systemctl is-active $svc 2>&1 || true)"
            done
            echo "--- 全部已启用(自启)的服务 ---"
            systemctl list-unit-files --state=enabled --type=service --no-pager | head -45
            echo "--- 运行中的服务（自定义部分）---"
            systemctl list-units --type=service --state=running --no-pager | grep -E "lucius|public|weekly|sealdice|gateway|note|report|node" || echo "（无匹配）"
            echo "--- docker 容器与重启策略（sudo）---"
            sudo docker ps --format '{{.Names}} | {{.Status}}' 2>&1 | head -8 || true
            for c in $(sudo docker ps -q 2>/dev/null); do
              sudo docker inspect --format '{{.Name}} | restart={{.HostConfig.RestartPolicy.Name}}' "$c" 2>/dev/null || true
            done
            echo "--- 定时任务（用户与条目数）---"
            for u in $(sudo ls /var/spool/cron/crontabs/ 2>/dev/null); do
              echo "[$u] $(sudo crontab -l -u "$u" 2>/dev/null | grep -vc '^#' || echo 0) 条"
            done
            echo
            echo "===== 网站发布目录 ====="
            echo "releases 目录数: $(ls -1d /var/www/trpg-helper/releases/*/ 2>/dev/null | wc -l)"
            ls -1dt /var/www/trpg-helper/releases/*/ 2>/dev/null | head -5
            du -sh /var/www/trpg-helper/releases 2>/dev/null || true
            du -sh /var/www/trpg-helper/current 2>/dev/null || true
