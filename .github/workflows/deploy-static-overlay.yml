name: Deploy static overlay

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-static-overlay.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package static shell
        run: tar -C dist -czf "trpg-static-shell-${{ github.sha }}.tar.gz" index.html assets
      - name: Upload static shell
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "trpg-static-shell-${{ github.sha }}.tar.gz"
          target: /tmp
          overwrite: true
      - name: Switch static release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            APP_ROOT=/var/www/trpg-helper
            RELEASE_DIR="${APP_ROOT}/releases/${{ github.sha }}"
            ARCHIVE="/tmp/trpg-static-shell-${{ github.sha }}.tar.gz"
            test -f "$ARCHIVE"
            test -f "${APP_ROOT}/current/index.html"
            mkdir -p "$RELEASE_DIR"
            cp -a "${APP_ROOT}/current/." "$RELEASE_DIR/"
            tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
            test -f "$RELEASE_DIR/index.html"
            sudo ln -s "$RELEASE_DIR" "${APP_ROOT}/.current-${{ github.sha }}"
            sudo mv -Tf "${APP_ROOT}/.current-${{ github.sha }}" "${APP_ROOT}/current"
            rm -f "$ARCHIVE"
