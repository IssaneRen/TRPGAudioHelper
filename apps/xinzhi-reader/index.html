<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="description" content="新枝 · 一个保护注意力的阅读空间。收藏、阅读、批注，所有数据只留在你的浏览器里。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="新枝" />
    <link rel="icon" type="image/svg+xml" href="leaf.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <title>新枝 · 阅读流</title>
    <script>
      try {
        var saved = localStorage.getItem('xinzhi.web.v1')
        if (saved) {
          var theme = JSON.parse(saved)?.state?.settings?.appearance
          if (theme) document.documentElement.dataset.theme = theme
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
